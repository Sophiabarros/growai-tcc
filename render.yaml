# Render Blueprint - backend do GrowAI (pasta backend/).
#
# O Render roda o Express como processo Node de longa duração (npm start ->
# node server.js), com o WebSocket em /ws na mesma porta. O site continua na
# Vercel; backend/vercel.json e backend/api/index.js só servem para o deploy
# antigo da Vercel e o Render os ignora.
#
# Como usar:
#   1. Dashboard do Render -> New -> Blueprint -> conectar o repo growai-tcc
#   2. O Render lê este arquivo e cria o serviço "growai-backend"
#   3. Preencher as variáveis marcadas com sync: false
#   4. A URL fica https://<nome>.onrender.com -> conferir se bate com
#      API_PRODUCAO em js/api.js
#
# Plano free: o serviço dorme após ~15 min sem requisição e a 1a resposta
# depois disso leva ~50 s. Com a placa principal ligada (telemetria a cada
# 15 s) ele não dorme.

services:
  - type: web
    name: growai-backend
    runtime: node
    plan: free
    # O Neon do projeto está em us-east-1; Virginia é a região mais perto.
    region: virginia
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

      # --- obrigatórias ---
      # Connection string do Neon (a mesma do growai-backend na Vercel).
      - key: DATABASE_URL
        sync: false
      # O MESMO valor da Vercel: com outro segredo, todo mundo é deslogado.
      - key: JWT_SECRET
        sync: false
      # Origem(ns) do site, separadas por vírgula: https://growai-xi.vercel.app
      - key: CORS_ORIGIN
        sync: false

      # --- e-mail (esqueci minha senha) ---
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false

      # --- IA ---
      - key: IA_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # NÃO trocar por um modelo -lite (ver backend/.env.example)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: IA_FOTO_INTERVALO_MIN
        value: "180"
