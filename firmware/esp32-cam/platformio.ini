; GrowAI - ESP32-CAM (AI-Thinker + placa MB)
; Compilar: pio run -d firmware/esp32-cam
; Gravar:   pio run -d firmware/esp32-cam -t upload   (com IO0 no GND, veja o README)

[env:esp32cam]
platform  = espressif32@6.9.0     ; Arduino core 2.0.17 - versao fixa de proposito
board     = esp32cam
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I ../shared
    -DBOARD_HAS_PSRAM
    -Wall

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17

