	<script>

    (function() {
        //Fix: the global variable "saindo" is set to true when leaving the menu (Play/Load)
        //and was never reset in the game scenes, which blocked the M key (go to Save screen).
        //Reset it every time a scene loads (Intro/Load already reset it at their start anyway).
        gdjs.registerRuntimeSceneLoadedCallback(function(runtimeScene) {
            var vars = runtimeScene.getGame().getVariables();
            if (vars.has("saindo")) vars.get("saindo").setBoolean(false);
        });

        //Initialization
        var game = new gdjs.RuntimeGame(gdjs.projectData, gdjs.runtimeGameOptions);

        //Turn off GDevelop's anonymous session analytics (removes the call to api.gdevelop-app.com)
        game.enableMetrics(false);

        //Create a renderer
        game.getRenderer().createStandardCanvas(document.body);

        //Bind keyboards/mouse/touch events
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);

        //Load all assets and start the game
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
